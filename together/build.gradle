plugins {
  id 'java'
  id 'org.springframework.boot' version '3.3.5'
  id 'io.spring.dependency-management' version '1.1.6'
  id 'org.flywaydb.flyway' version '10.20.1'
  id 'jacoco'
  id 'org.sonarqube' version '5.1.0.4882'
  id 'com.github.spotbugs' version '6.0.20'
  id 'org.owasp.dependencycheck' version '11.0.2'
}

group = 'ru.ifmo.is'
version = '0.1.0'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}

tasks.withType(JavaExec).configureEach {
  environment('LD_LIBRARY_PATH', "${rootDir}/vendor")
}

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
}

repositories {
  mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
}

dependencies {
  // Spring
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-mail'
  implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

  // JSON
  implementation 'com.fasterxml.jackson.datatype:jackson-datatype-hibernate5-jakarta:2.18.2'
  implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
  implementation 'com.networknt:json-schema-validator:1.5.4'

  // Lombok
  compileOnly 'org.projectlombok:lombok:1.18.34'
  annotationProcessor 'org.projectlombok:lombok:1.18.34'

  // MapStruct
  implementation 'org.mapstruct:mapstruct:1.6.3'
  implementation 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
  annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

  // MinIO
  implementation 'io.minio:minio:8.5.15'

  // ImageMagick
  implementation files("${System.getenv('VENDOR_PATH')}/jmagick.jar")

  // MIME Types
  implementation 'org.apache.tika:tika-core:3.0.1'

  // JJWT
  implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
  runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
  runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

  // Database
  runtimeOnly 'org.postgresql:postgresql:42.7.4'
  implementation 'org.hibernate:hibernate-core:6.6.3.Final'

  // Utils
  implementation 'org.apache.commons:commons-lang3:3.18.0'
  implementation 'com.fasterxml.uuid:java-uuid-generator:5.1.0'
  implementation 'commons-io:commons-io:2.17.0'

  // Flyway
  implementation 'org.flywaydb:flyway-core:10.20.1'
  implementation 'org.flywaydb:flyway-database-postgresql:10.20.1'
  runtimeOnly 'org.flywaydb:flyway-gradle-plugin:10.20.1'

  // Swagger UI
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

  // DevTools
  developmentOnly 'org.springframework.boot:spring-boot-devtools'

  // Testing
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.security:spring-security-test'
  testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
  testImplementation 'org.junit.jupiter:junit-jupiter-api'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}

jacoco {
  toolVersion = '0.8.12'
}

jacocoTestReport {
  dependsOn test
  finalizedBy jacocoTestCoverageVerification
  reports {
    xml.required = true
    html.required = true
  }
}

jacocoTestCoverageVerification {
  dependsOn test
  violationRules {
    rule {
      limit {
        minimum = 0.0
      }
    }
  }
}

tasks.named('test') {
  finalizedBy jacocoTestReport
  useJUnitPlatform()
  testLogging {
    exceptionFormat = 'full'
  }
}

dependencyCheck {
    failOnError = false  // Set to true to fail the build on CVSS score violations
    suppressionFile = file("$rootDir/config/dependency-check-suppressions.xml") // Optional: specify a suppression file
    
    analyzers {
        // Disable the assembly analyzer since it's .NET-specific
        assemblyEnabled = false
    }
    
    // Configure the CVSS threshold (vulnerabilities with scores equal or above this value will be flagged)
    cvssScoreThresholds = [
        low: 0,
        medium: 4.0,
        high: 7.0,
        critical: 9.0
    ]
}

// SpotBugs configuration with find-sec-bugs plugin for security scanning
spotbugs {
  toolVersion = '4.8.3'
  // Include find-sec-bugs plugin for security vulnerability detection
  plugins {
    create("findsecbugs") {
      artifact = "com.h3xstream.findsecbugs:findsecbugs-plugin:1.12.0"
    }
  }
  // Increase effort for more thorough analysis
  effort = "max"
  // Report all bug categories including security issues
  reportLevel = "high"
  // Enable all bug detectors including security ones
  includeFilter.setFrom("$rootDir/config/spotbugs-security-exclude.xml")
}

spotbugsMain {
  reports {
    html {
      required = true
      outputLocation = file("$buildDir/reports/spotbugs/main/spotbugs.html")
    }
    xml {
      required = true
      outputLocation = file("$buildDir/reports/spotbugs/main/spotbugs.xml")
    }
  }
  // Fail build on critical security issues
  if (project.hasProperty('failOnSpotBugs')) {
    ignoreFailures = false
  } else {
    ignoreFailures = true  // Set to false in production to fail on security issues
  }
}

spotbugsTest {
  reports {
    html {
      required = true
      outputLocation = file("$buildDir/reports/spotbugs/test/spotbugs.html")
    }
    xml {
      required = true
      outputLocation = file("$buildDir/reports/spotbugs/test/spotbugs.xml")
    }
  }
}

// Create a dedicated task for security analysis that fails on high priority issues
task spotbugsSecurity(type: com.github.spotbugs.snom.SpotBugsTask) {
  group = 'verification'
  description = 'Run SpotBugs security scan with strict rules'
  
  classes = files("$buildDir/classes/java/main")
  sourceSets = [project.extensions.getByType(JavaPluginExtension).sourceSets.main]
  classpath = project.sourceSets.main.runtimeClasspath
  
  reports {
    xml.required = true
    html.required = true
    html.outputLocation = file("$buildDir/reports/spotbugs/security-report.html")
  }
  
  // Strict mode: fail on high/critical security issues
  ignoreFailures = false
  effort = "max"
  reportLevel = "high"
  
  plugins {
    create("findsecbugs") {
      artifact = "com.h3xstream.findsecbugs:findsecbugs-plugin:1.12.0"
    }
  }
  
  // Only include security-related detectors
  includeFilter.setFrom("$rootDir/config/spotbugs-security-only.xml")
}

sonarqube {
  properties {
    property "sonar.projectKey", "together-project"
    property "sonar.projectName", "Together Application"
    property "sonar.projectVersion", "1.0"
    property "sonar.sourceEncoding", "UTF-8"
    property "sonar.sources", "src/main/java"
    property "sonar.tests", "src/test/java"
    property "sonar.java.coveragePlugin", "jacoco"
    property "sonar.jacoco.reportPaths", "${buildDir}/jacoco/test.exec"
  }
}
